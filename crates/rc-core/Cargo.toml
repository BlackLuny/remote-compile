[package]
name = "rc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tonic = { version = "0.14", features = ["router", "server", "channel", "transport", "gzip", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
blake3 = "1"
hex = "0.4"
thiserror = "2"
anyhow = "1"
regex = "1"
tracing = "0.1"
ulid = "3.0.0"
zstd = "0.13.3"

[build-dependencies]
tonic-prost-build = "0.14"
