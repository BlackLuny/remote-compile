syntax = "proto3";
package rc.v1;

// ============================ common ============================

enum EntryType {
  ENTRY_FILE = 0;
  ENTRY_SYMLINK = 1;
}

message FileEntry {
  string path = 1;          // repo-relative, '/' separated
  uint64 size = 2;
  string hash = 3;          // blake3 hex; symlink => hash of target string
  EntryType type = 4;
  bool executable = 5;
  // 该内容可由 L1 基线 (git archive base_commit) 直接得到，无需 CAS blob。
  // 基线不可用时（§4.1 降级链第 4 步）全部为 false，退化为全 L2 同步。
  bool in_baseline = 6;
  // symlink 的目标字符串原文。`hash` 是它的 blake3，用于身份与去重，
  // **不能**拿来重建链接——那样建出的是一条指向 64 位十六进制串的死链。
  // 仅当 type == ENTRY_SYMLINK 时有意义。
  string symlink_target = 7;
}

// 一个参与构建的本地目录。多根时（cargo path 依赖指向仓库外）用于披露与可观测；
// 条目本身一律进 Manifest.entries，路径以 anchor 为基准。
message RootInfo {
  string mount = 1;            // 相对 anchor 的路径，'/' 分隔；单根时为 ""
  string local_path = 2;       // 开发机上的绝对路径，仅供展示
  bool primary = 3;            // 调用方点名的那个根
  uint64 bytes = 4;
  uint32 files = 5;
}

// L2 dirty layer: the authoritative description of the workspace.
message Manifest {
  repeated FileEntry entries = 1;
  string root_hash = 2;        // blake3 over canonical entry list
  string base_commit = 3;      // "" when no git baseline
  bool baseline = 4;           // true => worker should materialize L1 from git mirror
  // 主根相对 anchor 的路径。单根时为 ""，此时 entries 的路径与历史完全一致，
  // root_hash 也因此不变。多根时 worker 把 L1 基线展开到 <workspace>/<anchor_mount>，
  // 构建目录也以它为前缀。
  string anchor_mount = 5;
  repeated RootInfo roots = 6;
}

message ResolvedProfile {
  string adapter = 1;
  string image = 2;            // MUST be a digest ref by the time it is hashed
  string path = 3;             // sub-project path inside the repo
  map<string, string> env = 4;
  repeated string features = 5;
  string target = 6;
  repeated string pre_commands = 7;
  map<string, string> tasks = 8;
  uint32 timeout_secs = 9;
  string toolchain = 10;
  string canonical = 11;       // canonical text form; hashed into the fingerprint
  string source = 12;          // explicit | repo | server | detected
}

message Diagnostic {
  string level = 1;            // error | warning | note
  string code = 2;
  string message = 3;
  string file = 4;
  uint32 line = 5;
  uint32 column = 6;
  string rendered = 7;
}

message TaskStats {
  uint64 queue_ms = 1;
  uint64 sync_ms = 2;
  uint64 build_ms = 3;
  uint64 upload_ms = 4;
  double cache_hit_rate = 5;
  uint64 bytes_synced = 6;
}

// ---- Verdict v2: evidence-backed attribution (additive; kind remains derived) ----

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_SUCCESS = 1;
  STATUS_FAILED = 2;
  STATUS_TIMEOUT = 3;
  STATUS_CANCELED = 4;
}

// Who should act. Default 0 is "unknown" — no evidence, no conviction.
// Enum value 5 is reserved for a future attribution.
enum Attribution {
  ATTR_UNKNOWN = 0;
  ATTR_CODE = 1;            // author: fix source
  ATTR_PROJECT_CONFIG = 2;  // project config / declared deps
  ATTR_RESOURCE = 3;        // task's own resource demand (OOM etc.)
  ATTR_INFRA = 4;           // fleet / network / image / disk
}

message Evidence {
  string source = 1;   // "docker_state" | "log_line" | "diagnostic" | "outcome"
  string excerpt = 2;  // ≤400 bytes after budget gate
  uint32 line_no = 3;  // log line number when source=log_line
}

message Verdict {
  Status status = 1;
  Attribution attribution = 2;
  Evidence evidence = 3;
  repeated string remediation = 4;
  string rule = 5;     // matched classifier rule name
}

// Collected by the worker before remove_container; feeds the classifier.
message ExecEvidence {
  bool oom_killed = 1;     // docker inspect .State.OOMKilled
  int32 term_signal = 2;   // main-process terminate signal when known
  bool worker_killed = 3;  // set only on the worker's own kill path
}

// Minimal libtest summary for classification evidence and test conclusions.
message TestSummary {
  uint32 passed = 1;
  uint32 failed = 2;
  uint32 ignored = 3;
  uint32 binaries = 4;
  repeated string failed_names = 5; // "binary::test_name", cap 20
  bool truncated = 6;
  bool summary_seen = 7;   // false ⇒ no summary line recognized
}

// Delta of diagnostics vs a baseline task (computed on read).
message DiagDelta {
  uint32 new_count = 1;
  uint32 fixed_count = 2;          // omitted (0) when approximate/truncated
  uint32 preexisting_count = 3;
  repeated Diagnostic new_diagnostics = 4;
  repeated string preexisting_summary = 5;
  string baseline_task_id = 6;
  bool approximate = 7;
}

// Intent scope for monorepo package selection (intent-and-query-surface).
enum ScopeKind {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_WORKSPACE = 1;
  SCOPE_PACKAGE = 2;
  SCOPE_PROFILE_OVERRIDE = 3;
  SCOPE_EXPLICIT_COMMAND = 4;
}

message PathContext {
  string intent_path = 1;
  string repo_root = 2;
  string relative_path = 3;
  ScopeKind scope = 4;
  repeated string packages = 5;
  string resolve_note = 7;
}

message PreCommandsStatus {
  uint32 total = 1;
  uint32 ran = 2;
  uint32 skipped = 3;
  string skip_reason = 4;
  repeated string skipped_commands = 5;
}

message EffectivePlan {
  PathContext path = 1;
  string task = 2;
  string command = 3;
  bool command_is_default = 4;
  string profile_source = 5;
  PreCommandsStatus pre_commands = 6;
  string cache_key_note = 7;
  string scope_hash = 8;
}

message TaskResult {
  string kind = 1;             // success|compile_error|env_error|infra_error|timeout
  repeated Diagnostic diagnostics = 2;
  uint32 error_count = 3;
  uint32 warning_count = 4;
  string log_ref = 5;
  TaskStats stats = 6;
  string summary = 7;
  int32 exit_code = 8;
  uint32 truncated_diagnostics = 9;
  // Missing system dependencies lifted out of the build log, already rendered
  // for an agent to read. Only ever populated for env_error.
  repeated string env_hints = 10;
  // Evidence-backed verdict; empty on results from pre-verdict workers.
  Verdict verdict = 11;
  TestSummary test_summary = 12;
  // Units observed during the build (Compiling/Checking lines).
  uint32 units_seen_total = 13;
  DiagDelta diag_delta = 14;
  // Execution receipt: what actually ran (intent-and-query-surface §5).
  EffectivePlan effective_plan = 15;
}

message Empty {}

// ============================ agent api ============================

message CheckBlobsReq {
  repeated string hashes = 1;
  string agent_session = 2;
}
message CheckBlobsResp {
  repeated string missing = 1;   // subset the agent must upload
}

message BlobChunk {
  string hash = 1;               // set on every chunk of a blob
  bytes data = 2;
  bool last = 3;
  uint64 total_size = 4;
}
message UploadBlobsResp {
  uint32 accepted = 1;
  repeated string rejected = 2;  // hash mismatch
}

message BaselineReq {
  string project_id = 1;
  string base_commit = 2;
}
message BaselineResp {
  bool have = 1;                 // server/mirror already has this commit
  repeated string known_commits = 2;  // bundle基点候选，用于 `git bundle create --not`
  bool upstream_public = 3;
}

message BundleUpload {
  string project_id = 1;
  string base_commit = 2;
  string blob_hash = 3;          // bundle already uploaded through UploadBlobs
  repeated string base_commits = 4;  // 该 bundle 的基点（--not 参数）
}

message SubmitTaskReq {
  string project_id = 1;
  string project_root = 2;       // canonical local root or repo url
  string repo_url = 3;
  string worktree_id = 4;
  string worktree_label = 5;
  string agent_session = 6;
  string task_type = 7;          // check|build|test|clippy|custom
  string command_override = 8;
  Manifest manifest = 9;
  ResolvedProfile profile = 10;
  string fingerprint = 11;
  string bundle_blob = 12;       // optional git bundle blob for the baseline layer
  bool no_cache = 13;
  // Hosts the repository asks the build to be able to reach (§7.1). A request,
  // not a grant: the control plane decides, and only what it approves is ever
  // handed to a worker.
  repeated string egress = 14;
  // Request-level env (layered under profile; denylist applies here only).
  map<string, string> env = 15;
  // Intent path → package scope (agent-resolved; server re-consumes for command).
  PathContext path_context = 16;
  // Agent precompute for cross-check only; server re-resolves authoritatively.
  bool command_is_default = 17;
}

message TaskHandle {
  string task_id = 1;
  string status = 2;
  bool cache_hit = 3;
  TaskResult result = 4;         // present when cache_hit
  // 服务端仍缺的 blob：agent 需补传后重新提交（§4.7 自愈路径）。
  repeated string missing_blobs = 5;
  bool subscribed = 6;           // 挂到了已有的同指纹任务上，而非新建
  string message = 7;
  // 已登记但尚未批准的出网域名：构建照跑，只是这些域名还不可达。
  repeated string egress_pending = 8;
  // 因为该 project 的审批队列已满而根本没有登记的域名。它们不会出现在
  // 审批队列里，所以必须在这里说出来，否则 agent 只会看到一个普通的网络错误。
  repeated string egress_refused = 9;
}

message TaskQuery {
  string task_id = 1;
  uint32 wait_secs = 2;          // long-poll window
  // When true, return as soon as progress_version advances past
  // seen_progress_version, or the task reaches a terminal state.
  bool return_on_progress = 3;
  uint64 seen_progress_version = 4;
  // Diagnostic baseline mode: auto | none | last_success | <task_id>
  string baseline = 5;
}

message TaskPhase {
  string phase = 1;
  int64 at_ms = 2;
  string worker_id = 3;
  string detail = 4;
}

message TaskStatus {
  string task_id = 1;
  string status = 2;             // pending|syncing|queued|running|uploading|done|failed|canceled|superseded
  TaskResult result = 3;
  repeated TaskPhase timeline = 4;
  uint32 attempt = 5;
  string worker_id = 6;
  int64 created_at = 7;
  int64 finished_at = 8;
  repeated string missing_blobs = 9;  // server asks the agent to re-upload
  string superseded_by = 10;
  // In-memory unit progress (not persisted to task_events).
  string current_unit = 11;
  uint32 units_seen = 12;
  uint64 progress_version = 13;
  // Historical reference for long-running builds (not an ETA).
  uint32 history_units_p50 = 14;
  uint64 history_build_ms_p50 = 15;
  // Queue navigation for pending tasks (intent-and-query-surface §7).
  uint32 queue_depth = 16;
  uint32 running = 17;
  uint32 capacity = 18;
  uint32 suggest_wait_secs = 19;
}

message LogQuery {
  string task_id = 1;
  uint64 offset = 2;             // line offset
  uint32 limit = 3;
  string grep = 4;
  bool tail = 5;
  // When true, skip per-line elision but still respect the response budget.
  bool raw = 6;
  // Byte offset within a single oversize line (raw inline continuation).
  uint64 line_byte_offset = 7;
}
message LogChunk {
  repeated string lines = 1;
  uint64 offset = 2;
  uint64 total_lines = 3;
  bool truncated = 4;
  uint64 next_offset = 5;
  uint64 bytes_omitted = 6;
  // Inline continuation for a single oversize line under raw=true.
  uint64 line_byte_offset = 7;
  uint64 next_byte_offset = 8;
  string line_no = 9;            // original server line number when continuing
  // Honest empty states: matched vs raw total (intent-and-query-surface §4.4).
  uint64 matched_lines = 10;
  string empty_reason = 11;      // "no_log" | "no_match" | ""
}

message CancelTaskReq {
  string task_id = 1;
  string agent_session = 2;
  // Caller's project identity for ownership check (§5.5). Token remains
  // fleet-wide; this is mis-cancel protection, not a cryptographic bound.
  string project_id = 3;
}
message CancelTaskResp {
  string task_id = 1;
  string status = 2;
  string message = 3;
}

message GetProfileReq {
  string project_id = 1;
  string path = 2;
}
message ProfileHealth {
  int64 last_success_at = 1;
  uint32 success_count = 2;
  uint32 total_count = 3;
  string created_by = 4;
}
message ProfileResp {
  bool found = 1;
  string config_toml = 2;
  ProfileHealth health = 3;
  string image_status = 4;
  string message = 5;
  // agent 必须用 digest 形式的镜像构造 ResolvedProfile（§5.1），
  // 这里给出控制面认为可用的那一个；为空表示还没有可用环境。
  string resolved_image = 6;
  string adapter = 7;
  // pre_commands still waiting for admin approval (concrete command lines).
  repeated string pending_pre_commands = 8;
}
message UpsertProfileReq {
  string project_id = 1;
  string path = 2;
  string config_toml = 3;
  string agent_session = 4;
}

message ListEnvsReq {
  string query = 1;
  string arch = 2;
  string target = 3;
}
message EnvHealth {
  int64 last_success_at = 1;
  double success_rate_7d = 2;
  uint32 total_runs = 3;
}
message EnvImage {
  string env_id = 1;
  string image_ref = 2;
  string digest = 3;
  string status = 4;
  repeated string arch = 5;
  repeated string targets = 6;
  EnvHealth health = 7;
  repeated string used_by = 8;
  int64 built_at = 9;
  string description = 10;
}
message ListEnvsResp { repeated EnvImage envs = 1; }

message PrepareEnvReq {
  string dockerfile = 1;
  string image_ref = 2;          // upstream image instead of a Dockerfile
  string project_id = 3;
  string reason = 4;
  string agent_session = 5;
  string description = 6;
}
message EnvQuery { string env_id = 1; }
message EnvStatus {
  string env_id = 1;
  string status = 2;
  string message = 3;
  string image_ref = 4;
  string digest = 5;
  string build_log_ref = 6;
  EnvHealth health = 7;
}

message WorkerBrief {
  string worker_id = 1;
  string status = 2;
  double cpu_load = 3;
  uint64 disk_free_gb = 4;
  uint32 running_tasks = 5;
  uint32 max_parallel = 6;
  string arch = 7;
  string version = 8;
  int64 last_heartbeat = 9;
}
message ListWorkersResp {
  repeated WorkerBrief workers = 1;
  uint32 queue_depth = 2;
  uint32 running = 3;
}

service AgentApi {
  rpc CheckBlobs(CheckBlobsReq) returns (CheckBlobsResp);
  rpc UploadBlobs(stream BlobChunk) returns (UploadBlobsResp);
  rpc RegisterBundle(BundleUpload) returns (Empty);
  rpc GetBaseline(BaselineReq) returns (BaselineResp);
  rpc SubmitTask(SubmitTaskReq) returns (TaskHandle);
  rpc GetTask(TaskQuery) returns (TaskStatus);
  rpc GetLog(LogQuery) returns (LogChunk);
  rpc GetProfile(GetProfileReq) returns (ProfileResp);
  rpc UpsertProfile(UpsertProfileReq) returns (ProfileResp);
  rpc ListEnvs(ListEnvsReq) returns (ListEnvsResp);
  rpc PrepareEnv(PrepareEnvReq) returns (EnvStatus);
  rpc GetEnvStatus(EnvQuery) returns (EnvStatus);
  rpc ListWorkers(Empty) returns (ListWorkersResp);
  rpc CancelTask(CancelTaskReq) returns (CancelTaskResp);
}

// ============================ worker api ============================

message EnrollReq {
  string enrollment_token = 1;
  string worker_id = 2;
  string version = 3;
  string arch = 4;
  uint32 cpu = 5;
  uint64 mem_gb = 6;
  uint64 disk_gb = 7;
  uint32 max_parallel = 8;
  map<string, string> labels = 9;
}
message EnrollResp {
  string worker_id = 1;
  string worker_token = 2;
}

message WorkerStats {
  double cpu_load = 1;
  uint64 disk_free_gb = 2;
  uint32 running_tasks = 3;
  repeated string cached_worktrees = 4;
  repeated string cached_projects = 5;
  repeated string cached_images = 6;
  double sccache_hit_rate = 7;
  uint32 gc_runs = 8;
  uint64 gc_reclaimed_mb = 9;
}

message Heartbeat {
  WorkerStats stats = 1;
  repeated string active_task_ids = 2;
  string status = 3;             // online|draining
  // worker 支持的可选能力，每次心跳上报。放在心跳而非 Enroll，是因为入伍只发生一次：
  // 一台升级过的老 worker 不会重新入伍，能力若只在入伍时记录就永远不会更新。
  repeated string capabilities = 4;
}

message TaskProgress {
  string task_id = 1;
  string phase = 2;
  string detail = 3;
  // Unit progress parsed from cargo Compiling/Checking lines.
  string current_unit = 4;
  uint32 units_seen = 5;
}

message TaskDone {
  string task_id = 1;
  TaskResult result = 2;
  string log_blob = 3;           // zstd-compressed log uploaded to CAS
  uint64 log_lines = 4;
  repeated string missing_blobs = 5;  // triggers blob_missing self-heal
}

message ImageBuildDone {
  string env_id = 1;
  bool ok = 2;
  string digest = 3;
  string message = 4;
  string log_blob = 5;
}

message WorkerEvent {
  oneof body {
    Heartbeat heartbeat = 1;
    TaskProgress progress = 2;
    TaskDone done = 3;
    ImageBuildDone image_done = 4;
  }
}

message TaskAssignment {
  string task_id = 1;
  string project_id = 2;
  string repo_url = 3;
  string worktree_id = 4;
  string task_type = 5;
  string command = 6;
  Manifest manifest = 7;
  ResolvedProfile profile = 8;
  repeated string bundle_blobs = 9;
  // Approved egress for this project, decided by the control plane. The worker
  // unions this with its own allowlist for this task only; it never reads the
  // agent's request, which arrives unvetted.
  repeated string egress_allow = 10;
  // Server-authoritative: whether `command` is the contract/adapter default
  // (including intent package scope). Worker parser gates on this; do not recompute.
  bool command_is_default = 11;
  string scope_hash = 12;
  // Authoritative path context for Receipt (must reach the worker result).
  PathContext path_context = 13;
}

message ImageBuildOrder {
  string env_id = 1;
  string dockerfile = 2;
  string image_ref = 3;
  string pull_ref = 4;
}

message ServerCmd {
  oneof body {
    TaskAssignment assign = 1;
    string cancel_task_id = 2;
    Empty drain = 3;
    ImageBuildOrder build_image = 4;
    Empty ping = 5;
  }
}

message BlobReq { string hash = 1; }
message PutBlobResp { string hash = 1; uint64 size = 2; }

service WorkerApi {
  rpc Enroll(EnrollReq) returns (EnrollResp);
  rpc Channel(stream WorkerEvent) returns (stream ServerCmd);
  rpc FetchBlob(BlobReq) returns (stream BlobChunk);
  rpc PutBlob(stream BlobChunk) returns (PutBlobResp);
}
