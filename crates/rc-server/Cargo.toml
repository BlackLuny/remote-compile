[package]
name = "rc-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rc-core = { path = "../rc-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
futures = "0.3"

tonic = { version = "0.14", features = ["router", "server", "transport", "gzip"] }
tonic-prost = "0.14"
prost = "0.14"

axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-gzip"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

argon2 = { version = "0.5", features = ["std"] }
blake3 = "1"
hex = "0.4"

clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
parking_lot = "0.12"
